                          type: integer
                          example: 24
                        name:
                          type: string
                          example: 'Business-focused intangible internetsolution'
                        description:
                          type: string
                          example: null
                          nullable: true
                        created_at:
                          type: string
                          example: '2026-06-06T21:18:28.000000Z'
                        updated_at:
                          type: string
                          example: '2026-06-06T21:18:28.000000Z'
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: '/?page=1'
                      last:
                        type: string
                        example: '/?page=1'
                      prev:
                        type: string
                        example: null
                        nullable: true
                      next:
                        type: string
                        example: null
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 1
                      links:
                        type: array
                        example:
                          - url: null
                            label: '&laquo; Previous'
                            page: null
                            active: false
                          - url: '/?page=1'
                            label: '1'
                            page: 1
                            active: true
                          - url: null
                            label: 'Next &raquo;'
                            page: null
                            active: false
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              example: null
                              nullable: true
                            label:
                              type: string
                              example: '&laquo; Previous'
                            page:
                              type: string
                              example: null
                              nullable: true
                            active:
                              type: boolean
                              example: false
                      path:
                        type: string
                        example: /
                      per_page:
                        type: integer
                        example: 15
                      to:
                        type: integer
                        example: 2
                      total:
                        type: integer
                        example: 2
      tags:
        - Projects
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                search:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                sort:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: 'n'
    post:
      summary: 'Create a project for the authenticated user.'
      operationId: createAProjectForTheAuthenticatedUser
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 26
                    name: 'Reverse-engineered fault-tolerant success'
                    description: 'Deserunt aut ab provident perspiciatis quo omnis nostrum. Adipisci quidem nostrum qui commodi incidunt iure. Et et modi ipsum nostrum.'
                    created_at: '2026-06-06T21:18:28.000000Z'
                    updated_at: '2026-06-06T21:18:28.000000Z'
                properties:
                  data:
                    type: object
                    properties:
