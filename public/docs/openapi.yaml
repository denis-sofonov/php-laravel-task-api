                        example: 'Deserunt aut ab provident perspiciatis quo omnis nostrum. Adipisci quidem nostrum qui commodi incidunt iure. Et et modi ipsum nostrum.'
                      created_at:
                        type: string
                        example: '2026-06-06T21:18:28.000000Z'
                      updated_at:
                        type: string
                        example: '2026-06-06T21:18:28.000000Z'
