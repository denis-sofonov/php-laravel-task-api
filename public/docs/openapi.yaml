openapi: 3.0.3
info:
  title: 'Backend Template API Documentation'
  description: 'Token-authenticated REST API for managing projects and tasks.'
  version: 1.0.0
servers:
  - url: 'http://localhost'
tags:
  - name: Endpoints
    description: ''
  - name: Projects
    description: "\nManage the authenticated user's projects."
  - name: System
    description: ''
  - name: Tasks
    description: "\nTasks that belong to a project."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtain a token from <code>POST /api/v1/login</code> or <code>POST /api/v1/register</code>, then send it as <code>Authorization: Bearer {token}</code>.'
security:
  -
    default: []
paths:
  /api/v1/health:
    get:
      summary: "Liveness probe for load balancers / k8s. Returns 200 if the DB is\nreachable, otherwise 503."
      operationId: livenessProbeForLoadBalancersK8sReturns200IfTheDBIsReachableOtherwise503
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: ok
                  services:
                    database: ok
                  timestamp: '2026-06-06T21:18:27+00:00'
                properties:
                  status:
                    type: string
                    example: ok
                  services:
                    type: object
                    properties:
                      database:
                        type: string
                        example: ok
                  timestamp:
                    type: string
                    example: '2026-06-06T21:18:27+00:00'
      tags:
        - Endpoints
      security: []
  /api/v1/register:
    post:
      summary: ''
      operationId: postApiV1Register
      description: ''
      parameters: []
      responses:
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The password field confirmation does not match. (and 1 more error)'
                  errors:
                    password:
                      - 'The password field confirmation does not match.'
                      - 'The password field must be at least 8 characters.'
                properties:
                  message:
                    type: string
                    example: 'The password field confirmation does not match. (and 1 more error)'
                  errors:
                    type: object
                    properties:
                      password:
                        type: array
                        example:
                          - 'The password field confirmation does not match.'
                          - 'The password field must be at least 8 characters.'
                        items:
                          type: string
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: zbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
              required:
                - name
                - email
                - password
      security: []
  /api/v1/login:
    post:
      summary: ''
      operationId: postApiV1Login
      description: ''
      parameters: []
      responses:
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'These credentials do not match our records.'
                  errors:
                    email:
                      - 'These credentials do not match our records.'
                properties:
                  message:
                    type: string
                    example: 'These credentials do not match our records.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'These credentials do not match our records.'
                        items:
                          type: string
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                device_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: v
              required:
                - email
                - password
      security: []
  /api/v1/forgot-password:
    post:
      summary: 'Step 1: request a password reset link.'
      operationId: step1RequestAPasswordResetLink
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'If the email exists, a reset link has been sent.'
                properties:
                  message:
                    type: string
                    example: 'If the email exists, a reset link has been sent.'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
              required:
                - email
      security: []
  /api/v1/reset-password:
    post:
      summary: 'Step 2: set a new password using the token from the email.'
      operationId: step2SetANewPasswordUsingTheTokenFromTheEmail
      description: ''
      parameters: []
      responses:
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The password field confirmation does not match. (and 1 more error)'
                  errors:
                    password:
                      - 'The password field confirmation does not match.'
                      - 'The password field must be at least 8 characters.'
                properties:
                  message:
                    type: string
                    example: 'The password field confirmation does not match. (and 1 more error)'
                  errors:
                    type: object
                    properties:
                      password:
                        type: array
                        example:
                          - 'The password field confirmation does not match.'
                          - 'The password field must be at least 8 characters.'
                        items:
                          type: string
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: ''
                  example: architecto
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: zbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
              required:
                - token
                - email
                - password
      security: []
  '/api/v1/email/verify/{id}/{hash}':
    get:
      summary: "Verify an email via the signed link. No auth required — the route\nsignature ('signed' middleware) is what proves authenticity."
      operationId: verifyAnEmailViaTheSignedLinkNoAuthRequiredTheRouteSignaturesignedMiddlewareIsWhatProvesAuthenticity
      description: ''
      parameters: []
      responses:
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Invalid signature.'
                properties:
                  message:
                    type: string
                    example: 'Invalid signature.'
      tags:
        - Endpoints
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the verify.'
        example: architecto
        required: true
        schema:
          type: string
      -
        in: path
        name: hash
        description: ''
        example: architecto
        required: true
        schema:
          type: string
  /api/v1/user:
    get:
      summary: ''
      operationId: getApiV1User
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
      security: []
  /api/v1/logout:
    post:
      summary: ''
      operationId: postApiV1Logout
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
      security: []
  /api/v1/email/verification-notification:
    post:
      summary: 'Resend the verification email to the authenticated user.'
      operationId: resendTheVerificationEmailToTheAuthenticatedUser
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
      security: []
  /api/v1/projects:
    get:
      summary: "List the authenticated user's projects (paginated)."
      operationId: listTheAuthenticatedUsersProjectspaginated
      description: ''
      parameters:
        -
          in: query
          name: search
          description: 'Filter by name.'
          example: redesign
          required: false
          schema:
            type: string
            description: 'Filter by name.'
            example: redesign
        -
          in: query
          name: sort
          description: 'created_at or name, prefix with - for descending.'
          example: '-created_at'
          required: false
          schema:
            type: string
            description: 'created_at or name, prefix with - for descending.'
            example: '-created_at'
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 24
                      name: 'Business-focused intangible internetsolution'
                      description: null
                      created_at: '2026-06-06T21:18:28.000000Z'
                      updated_at: '2026-06-06T21:18:28.000000Z'
                    -
                      id: 25
                      name: 'Versatile clear-thinking database'
                      description: null
                      created_at: '2026-06-06T21:18:28.000000Z'
                      updated_at: '2026-06-06T21:18:28.000000Z'
                  links:
                    first: '/?page=1'
                    last: '/?page=1'
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    from: 1
                    last_page: 1
                    links:
                      -
                        url: null
                        label: '&laquo; Previous'
                        page: null
                        active: false
                      -
                        url: '/?page=1'
                        label: '1'
                        page: 1
                        active: true
                      -
                        url: null
                        label: 'Next &raquo;'
                        page: null
                        active: false
                    path: /
                    per_page: 15
                    to: 2
                    total: 2
                properties:
                  data:
                    type: array
                    example:
                      - id: 24
                        name: 'Business-focused intangible internetsolution'
                        description: null
                        created_at: '2026-06-06T21:18:28.000000Z'
                        updated_at: '2026-06-06T21:18:28.000000Z'
                      - id: 25
                        name: 'Versatile clear-thinking database'
