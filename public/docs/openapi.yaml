openapi: 3.0.3
info:
  title: 'Backend Template API Documentation'
  description: 'Token-authenticated REST API for managing projects and tasks.'
  version: 1.0.0
servers:
  - url: 'http://localhost'
tags:
  - name: Endpoints
    description: ''
  - name: Projects
    description: "\nУправление проектами текущего пользователя."
  - name: System
    description: ''
  - name: Tasks
    description: "\nЗадачи внутри проектов."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtain a token from <code>POST /api/v1/login</code> or <code>POST /api/v1/register</code>, then send it as <code>Authorization: Bearer {token}</code>.'
security:
  -
    default: []
paths:
  /api/v1/health:
    get:
      summary: 'Проверка живости сервиса для load balancer / k8s probes.'
      operationId: LoadBalancerK8sProbes
      description: 'Возвращает 200, если БД доступна, иначе 503.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: ok
                  services:
                    database: ok
                  timestamp: '2026-06-06T20:34:45+00:00'
                properties:
                  status:
                    type: string
                    example: ok
                  services:
                    type: object
                    properties:
                      database:
                        type: string
                        example: ok
                  timestamp:
                    type: string
                    example: '2026-06-06T20:34:45+00:00'
      tags:
        - Endpoints
      security: []
  /api/v1/register:
    post:
      summary: 'Регистрация нового пользователя и выдача токена.'
      operationId: ''
      description: ''
      parameters: []
      responses:
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The password field confirmation does not match. (and 1 more error)'
                  errors:
                    password:
                      - 'The password field confirmation does not match.'
                      - 'The password field must be at least 8 characters.'
                properties:
                  message:
                    type: string
                    example: 'The password field confirmation does not match. (and 1 more error)'
                  errors:
                    type: object
                    properties:
                      password:
                        type: array
                        example:
                          - 'The password field confirmation does not match.'
                          - 'The password field must be at least 8 characters.'
                        items:
                          type: string
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: zbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
              required:
                - name
                - email
                - password
      security: []
  /api/v1/login:
    post:
      summary: 'Вход: проверяем учётные данные и выдаём новый токен.'
      operationId: ''
      description: ''
      parameters: []
      responses:
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'These credentials do not match our records.'
                  errors:
                    email:
                      - 'These credentials do not match our records.'
                properties:
                  message:
                    type: string
                    example: 'These credentials do not match our records.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'These credentials do not match our records.'
                        items:
                          type: string
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                device_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: v
              required:
                - email
                - password
      security: []
  /api/v1/forgot-password:
    post:
      summary: 'Шаг 1: запросить ссылку для сброса пароля.'
      operationId: '1'
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'If the email exists, a reset link has been sent.'
                properties:
                  message:
                    type: string
                    example: 'If the email exists, a reset link has been sent.'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
              required:
                - email
      security: []
  /api/v1/reset-password:
    post:
      summary: 'Шаг 2: установить новый пароль по токену из письма.'
      operationId: '2'
      description: ''
      parameters: []
      responses:
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The password field confirmation does not match. (and 1 more error)'
                  errors:
                    password:
                      - 'The password field confirmation does not match.'
                      - 'The password field must be at least 8 characters.'
                properties:
                  message:
                    type: string
                    example: 'The password field confirmation does not match. (and 1 more error)'
                  errors:
                    type: object
                    properties:
                      password:
                        type: array
                        example:
                          - 'The password field confirmation does not match.'
                          - 'The password field must be at least 8 characters.'
                        items:
                          type: string
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: ''
                  example: architecto
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: zbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
              required:
                - token
                - email
                - password
      security: []
  '/api/v1/email/verify/{id}/{hash}':
    get:
      summary: 'Подтверждение email по подписанной ссылке из письма.'
      operationId: Email
      description: "Ссылка содержит id пользователя и hash (sha1 от email) — auth не требуется,\nподлинность гарантирует подпись маршрута (middleware 'signed')."
      parameters: []
      responses:
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Invalid signature.'
                properties:
                  message:
                    type: string
                    example: 'Invalid signature.'
      tags:
        - Endpoints
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the verify.'
        example: architecto
        required: true
        schema:
          type: string
      -
        in: path
        name: hash
        description: ''
        example: architecto
        required: true
        schema:
          type: string
  /api/v1/user:
    get:
      summary: 'Текущий авторизованный пользователь (по токену).'
      operationId: ''
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
      security: []
  /api/v1/logout:
    post:
      summary: 'Выход: отзываем только тот токен, которым сделан текущий запрос.'
      operationId: ''
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
      security: []
  /api/v1/email/verification-notification:
    post:
      summary: 'Повторная отправка письма подтверждения (для авторизованного пользователя).'
      operationId: ''
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
      security: []
  /api/v1/projects:
    get:
      summary: 'Список проектов текущего пользователя (с пагинацией).'
      operationId: ''
      description: ''
      parameters:
        -
          in: query
          name: search
          description: 'Поиск по названию.'
          example: redesign
          required: false
          schema:
            type: string
            description: 'Поиск по названию.'
            example: redesign
        -
          in: query
          name: sort
          description: 'Сортировка: created_at или name, с префиксом - для убывания.'
          example: '-created_at'
          required: false
          schema:
            type: string
            description: 'Сортировка: created_at или name, с префиксом - для убывания.'
            example: '-created_at'
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 14
                      name: 'Business-focused intangible internetsolution'
                      description: null
                      created_at: '2026-06-06T20:34:46.000000Z'
                      updated_at: '2026-06-06T20:34:46.000000Z'
                    -
                      id: 15
                      name: 'Versatile clear-thinking database'
                      description: null
                      created_at: '2026-06-06T20:34:46.000000Z'
                      updated_at: '2026-06-06T20:34:46.000000Z'
                  links:
                    first: '/?page=1'
                    last: '/?page=1'
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    from: 1
                    last_page: 1
                    links:
                      -
                        url: null
                        label: '&laquo; Previous'
                        page: null
                        active: false
                      -
                        url: '/?page=1'
                        label: '1'
                        page: 1
                        active: true
                      -
                        url: null
                        label: 'Next &raquo;'
                        page: null
                        active: false
                    path: /
                    per_page: 15
                    to: 2
                    total: 2
                properties:
                  data:
                    type: array
                    example:
                      - id: 14
                        name: 'Business-focused intangible internetsolution'
                        description: null
                        created_at: '2026-06-06T20:34:46.000000Z'
                        updated_at: '2026-06-06T20:34:46.000000Z'
                      - id: 15
                        name: 'Versatile clear-thinking database'
                        description: null
                        created_at: '2026-06-06T20:34:46.000000Z'
                        updated_at: '2026-06-06T20:34:46.000000Z'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 14
                        name:
                          type: string
                          example: 'Business-focused intangible internetsolution'
                        description:
                          type: string
                          example: null
                          nullable: true
                        created_at:
                          type: string
                          example: '2026-06-06T20:34:46.000000Z'
                        updated_at:
                          type: string
                          example: '2026-06-06T20:34:46.000000Z'
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: '/?page=1'
                      last:
                        type: string
                        example: '/?page=1'
                      prev:
                        type: string
                        example: null
                        nullable: true
                      next:
                        type: string
                        example: null
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 1
                      links:
                        type: array
                        example:
                          - url: null
                            label: '&laquo; Previous'
                            page: null
                            active: false
                          - url: '/?page=1'
                            label: '1'
                            page: 1
                            active: true
                          - url: null
                            label: 'Next &raquo;'
                            page: null
                            active: false
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              example: null
                              nullable: true
                            label:
                              type: string
                              example: '&laquo; Previous'
                            page:
                              type: string
                              example: null
                              nullable: true
                            active:
                              type: boolean
                              example: false
                      path:
                        type: string
                        example: /
                      per_page:
                        type: integer
                        example: 15
                      to:
                        type: integer
                        example: 2
                      total:
                        type: integer
                        example: 2
      tags:
        - Projects
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                search:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                sort:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: 'n'
    post:
      summary: 'Создать проект для текущего пользователя.'
      operationId: ''
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 16
                    name: 'Reverse-engineered fault-tolerant success'
                    description: 'Deserunt aut ab provident perspiciatis quo omnis nostrum. Adipisci quidem nostrum qui commodi incidunt iure. Et et modi ipsum nostrum.'
                    created_at: '2026-06-06T20:34:46.000000Z'
                    updated_at: '2026-06-06T20:34:46.000000Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 16
                      name:
                        type: string
                        example: 'Reverse-engineered fault-tolerant success'
                      description:
                        type: string
                        example: 'Deserunt aut ab provident perspiciatis quo omnis nostrum. Adipisci quidem nostrum qui commodi incidunt iure. Et et modi ipsum nostrum.'
                      created_at:
                        type: string
                        example: '2026-06-06T20:34:46.000000Z'
                      updated_at:
                        type: string
                        example: '2026-06-06T20:34:46.000000Z'
