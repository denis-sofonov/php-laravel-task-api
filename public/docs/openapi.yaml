                description:
                  type: string
                  description: 'Must not be greater than 5000 characters.'
                  example: 'Et animi quos velit et fugiat.'
                  nullable: true
    delete:
      summary: "Delete a project (its tasks are removed via the migration's cascade)."
      operationId: deleteAProjectitsTasksAreRemovedViaTheMigrationsCascade
      description: ''
      parameters: []
      responses:
        204:
          description: Deleted
          content:
            text/plain:
              schema:
                type: string
                example: ''
      tags:
        - Projects
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the project.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/stats:
    get:
      summary: 'Per-user counts.'
      operationId: perUserCounts
      description: "Cached for 60s: the aggregates are slightly stale within the TTL, which is\nan acceptable trade-off for dashboard-style numbers."
      parameters: []
