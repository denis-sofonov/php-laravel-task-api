                description:
                  type: string
                  description: 'Must not be greater than 5000 characters.'
                  example: 'Et animi quos velit et fugiat.'
                  nullable: true
    delete:
      summary: 'Удалить проект (вместе с задачами — каскадом из миграции).'
      operationId: ''
      description: ''
      parameters: []
      responses:
        204:
          description: Deleted
          content:
            text/plain:
              schema:
                type: string
                example: ''
      tags:
        - Projects
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the project.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/stats:
    get:
      summary: 'Сводка по данным пользователя (кешируется на 60 секунд).'
      operationId: '60'
      description: "Результат кешируется на 60 секунд (Cache::remember): первый запрос\nсчитает агрегаты, последующие в течение TTL берут готовое из кеша.\nДопускается небольшая неактуальность данных — обычный приём для дашбордов."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - System
  '/api/v1/projects/{project_id}/tasks':
    get:
      summary: 'Список задач конкретного проекта.'
      operationId: ''
      description: '$project приходит из вложенного маршрута projects/{project}/tasks.'
      parameters:
        -
          in: query
          name: status
          description: 'Фильтр по статусу: todo, in_progress, done.'
          example: todo
          required: false
          schema:
