# Docker environment.
#
# Two modes:
#   1) Database only (local dev via `php artisan serve`):
#        docker compose up -d postgres
#   2) Full stack in containers (php-fpm + nginx + postgres):
#        docker compose up -d --build
#        API: http://localhost:8080/api/v1
#        migrate: docker compose exec app php artisan migrate --seed
#
# Stop: docker compose down   (wipe data: docker compose down -v)

services:
  postgres:
    image: postgres:17-alpine
    container_name: template_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-template}
      POSTGRES_USER: ${DB_USERNAME:-template}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      # host:container — expose 5432 so the local PHP process can reach the DB
      - "${DB_PORT:-5432}:5432"
    volumes:
      # named volume — data survives container restarts
      - pgdata:/var/lib/postgresql/data
      # init scripts run once, on first container creation
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Laravel/CI wait until the DB is actually accepting connections
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-template} -d ${DB_DATABASE:-template}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PHP-FPM with the application code (production-like image).
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: template_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the compose network the DB is reachable by service name on its default port.
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  # Nginx — entry point, proxies PHP to the app container.
  web:
    image: nginx:alpine
    container_name: template_web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
