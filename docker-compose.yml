# Окружение в Docker.
#
# Два сценария:
#   1) Только база (локальная разработка через `php artisan serve`):
#        docker compose up -d postgres
#   2) Весь стек в контейнерах (php-fpm + nginx + postgres):
#        docker compose up -d --build
#        API: http://localhost:8080/api/v1
#        миграции: docker compose exec app php artisan migrate --seed
#
# Остановить: docker compose down   (с очисткой данных: docker compose down -v)

services:
  postgres:
    image: postgres:17-alpine
    container_name: template_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-template}
      POSTGRES_USER: ${DB_USERNAME:-template}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      # хост:контейнер — пробрасываем 5432 наружу, чтобы локальный PHP видел базу
      - "${DB_PORT:-5432}:5432"
    volumes:
      # именованный volume — данные переживают перезапуск контейнера
      - pgdata:/var/lib/postgresql/data
      # init-скрипты выполняются один раз при первом создании контейнера
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Laravel/CI ждут, пока база реально готова принимать соединения
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-template} -d ${DB_DATABASE:-template}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PHP-FPM с кодом приложения (production-подобный образ).
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: template_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Внутри сети compose база доступна по имени сервиса на стандартном порту.
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  # Nginx — точка входа, проксирует PHP в контейнер app.
  web:
    image: nginx:alpine
    container_name: template_web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
