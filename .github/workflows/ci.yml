name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          # CI прогоняет тесты — поднимаем сразу тестовую базу.
          POSTGRES_DB: template_testing
          POSTGRES_USER: template
          POSTGRES_PASSWORD: secret
        ports:
          # совпадает с DB_PORT из .env.example
          - 5435:5432
        options: >-
          --health-cmd="pg_isready -U template"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, bcmath, intl
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Security audit (dependencies)
        run: composer audit

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: composer lint:test

      - name: Static analysis (Larastan)
        run: composer analyse

      - name: Tests (Pest)
        run: composer test
